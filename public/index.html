<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Verificação WhatsApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📱 Criar Conta</h1>
            <p class="subtitulo">Cadastre-se com verificação via WhatsApp</p>
            
            <!-- Etapa 1: Dados -->
            <div id="etapa1">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" placeholder="Seu nome" required minlength="2">
                </div>
                
                <div class="form-group">
                    <label for="sobrenome">Sobrenome *</label>
                    <input type="text" id="sobrenome" placeholder="Seu sobrenome" required minlength="2">
                </div>
                
                <div class="form-group">
                    <label for="telefone">WhatsApp *</label>
                    <input type="tel" id="telefone" placeholder="(44) 99952-5600" required>
                    <small>Digite com DDD</small>
                </div>
                
                <button onclick="enviarCodigo()" id="btn-enviar">
                    📨 Enviar Código
                </button>
            </div>
            
            <!-- Etapa 2: Verificação -->
            <div id="etapa2" style="display: none;">
                <div class="mensagem-enviado">
                    ✅ Código enviado para <strong id="telefone-exibido"></strong>
                </div>
                
                <div class="form-group">
                    <label for="codigo">Código de 6 dígitos *</label>
                    <input type="text" id="codigo" placeholder="000000" maxlength="6" pattern="[0-9]{6}">
                    <small>Verifique seu WhatsApp</small>
                </div>
                
                <div class="botoes">
                    <button onclick="verificarCodigo()" id="btn-verificar">
                        ✅ Verificar Código
                    </button>
                    <button onclick="voltar()" class="btn-voltar">
                        ↩️ Voltar
                    </button>
                </div>
            </div>
            
            <!-- Etapa 3: Sucesso -->
            <div id="etapa3" style="display: none;">
                <div class="sucesso">
                    <h2>🎉 Cadastro Realizado!</h2>
                    <p>Bem-vindo(a) <strong id="nome-usuario"></strong>!</p>
                    <p>Seu cadastro foi concluído com sucesso.</p>
                </div>
            </div>
            
            <!-- Loading -->
            <div id="loading" style="display: none;">
                <div class="spinner"></div>
                <p id="loading-text">Enviando...</p>
            </div>
            
            <!-- Mensagens -->
            <div id="mensagem" class="mensagem" style="display: none;"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
